<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Ular.io</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="score">Skor: <b id="score">0</b></div>
  <ol id="board"></ol>
</div>

<button id="boost">Ngebut</button>

<div id="overlay">
  <div class="box">
    <h1 id="title">Ular.io</h1>
    <p id="info">Arahkan ular dengan mouse atau jari. Makan titik warna-warni agar makin panjang. Jangan menabrak badan ular lain!</p>
    <p class="small">Ngebut: tahan klik kiri, tombol Spasi, atau tombol Ngebut (mengurangi panjang).</p>
    <button id="play">Main</button>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
